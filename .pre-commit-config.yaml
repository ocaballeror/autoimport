---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-ast
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.14"
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.11.16"
    hooks:
      # Update the uv lockfile
      - id: uv-lock
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c '
          uv run dmypy --status-file .precommit-mypy run -- "$@";
          ret=$?;
          [ $ret -gt 1 ] || exit $ret;
          uv run dmypy --status-file .precommit-mypy restart
          uv run dmypy --status-file .precommit-mypy run -- "$@";
          '
        args: [--, --scripts-are-modules, src]
        language: system
        pass_filenames: false
        require_serial: true
        types: [file, python]
